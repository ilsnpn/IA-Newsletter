<!-- ============ masthead ============ -->
<text class="serif ink" x="80" y="238" font-size="92" font-weight="700" letter-spacing="-1.5">La Newsletter IA</text>
<text class="sans caps mut" x="80" y="272" font-size="12" letter-spacing=".26em">L'actualité de l'intelligence artificielle, décryptée</text>
