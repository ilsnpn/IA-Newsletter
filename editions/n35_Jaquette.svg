<!-- ============ le sujet du numéro, raconté par l'échelle ============ -->
<text class="sans caps acc" x="80" y="556" font-size="12" letter-spacing=".26em">Évaporés en Bourse par les champions chinois de l'IA</text>

<text class="serif acc" x="80" y="781" font-size="190" font-weight="700" letter-spacing="-6">480 Md $</text>

<text class="sans mut" x="80" y="859" font-size="16">L'indice STAR50 a perdu 40 % depuis juillet, selon Reuters.</text>

