<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1350" width="1000" height="1350" role="img" aria-label="Jaquette de La Newsletter IA, édition numéro 28, IA de l'innovation dans la compression, 31 août 2026">
<title>La Newsletter IA · N°28 · IA de l'innovation dans la compression</title>
<style>
  /* Polices du site déclarées explicitement, sans passer par un @import :
     certains lecteurs SVG ignorent les imports en cascade. Repli sur Georgia
     et Helvetica si la connexion manque. */
  @font-face{font-family:'Playfair Display';font-style:normal;font-weight:500;font-display:swap;
    src:url(https://fonts.gstatic.com/s/playfairdisplay/v40/nuFvD-vYSZviVYUb_rj3ij__anPXJzDwcbmjWBN2PKd3vUDQ.ttf) format('truetype')}
  @font-face{font-family:'Playfair Display';font-style:normal;font-weight:700;font-display:swap;
    src:url(https://fonts.gstatic.com/s/playfairdisplay/v40/nuFvD-vYSZviVYUb_rj3ij__anPXJzDwcbmjWBN2PKeiukDQ.ttf) format('truetype')}
  @font-face{font-family:'Playfair Display';font-style:normal;font-weight:400;font-display:swap;
    src:url(https://fonts.gstatic.com/s/playfairdisplay/v40/nuFvD-vYSZviVYUb_rj3ij__anPXJzDwcbmjWBN2PKdFvUDQ.ttf) format('truetype')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;
    src:url(https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuLyfMZg.ttf) format('truetype')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;
    src:url(https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuFuYMZg.ttf) format('truetype')}
  /* Inter en graisse 200 : c'est elle qui trace le filigrane, en traits fins. */
  @font-face{font-family:'Inter';font-style:normal;font-weight:200;font-display:swap;
    src:url(https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuDyfMZg.ttf) format('truetype')}
  .serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
  .sans{font-family:'Inter','Helvetica Neue',Arial,sans-serif}
  .ink{fill:#191613}
  .acc{fill:#A9502F}
  .mut{fill:#8a8378}
  .caps{text-transform:uppercase;font-weight:700}
  .rule{stroke:#191613}
  .hair{stroke:#191613;opacity:.13}
</style>

<rect width="1000" height="1350" fill="#F3EFE6"/>

<!-- Numéro en filigrane, centré sur la page et débordant des quatre côtés.
     Le rapport hauteur / largeur ne dépend pas de la police mais d'une
     compression horizontale : scale(0.43,1) rend les chiffres trois fois plus
     hauts que larges, quelle que soit la police réellement chargée. Graisse 200
     pour n'avoir que des traits fins.
     Trois réglages, dans cet ordre d'importance :
       scale(X,1)  0.43 = trois fois plus haut que large · 0.30 = encore plus étiré
       font-size   2550 = déborde en haut et en bas · 1900 = tient dans la hauteur
       opacity     .025 = valeur retenue · .045 = nettement visible -->
<text class="sans ink" x="0" y="0" font-size="2550" font-weight="200"
      text-anchor="middle" dominant-baseline="central" opacity=".025"
      transform="translate(500,675) scale(0.43,1)">28</text>

<!-- ============ dateline ============ -->
<text class="sans caps ink" x="80" y="106" font-size="19" letter-spacing=".2em">Édition N°28</text>
<text class="sans caps mut" x="920" y="106" font-size="19" letter-spacing=".2em" text-anchor="end">31 août 2026</text>
<line class="hair" x1="80" y1="132" x2="920" y2="132" stroke-width="1"/>

<!-- ============ masthead ============ -->
<text class="serif ink" x="80" y="238" font-size="92" font-weight="700" letter-spacing="-1.5">La Newsletter IA</text>
<text class="sans caps mut" x="80" y="272" font-size="12" letter-spacing=".26em">L'actualité de l'intelligence artificielle, décryptée</text>
<line class="rule" x1="80" y1="296" x2="920" y2="296" stroke-width="2"/>

<!-- ============ coverline principale ============ -->
<text class="serif ink" x="80" y="386" font-size="56" font-weight="500" letter-spacing="-.5">IA de l'innovation</text>
<text class="serif ink" x="80" y="450" font-size="56" font-weight="500" letter-spacing="-.5">dans la compression</text>

<!-- ============ le sujet du numéro, raconté par l'échelle ============
     Le chiffre est calé par le haut de ses capitales (y=648), pas par sa
     ligne de base : c'est ce que l'œil aligne d'une couverture à l'autre.
     ligne de base = 648 + 0,70 x corps · légende = ligne de base + 78 -->
<text class="sans caps acc" x="80" y="556" font-size="12" letter-spacing=".26em">Liquid AI</text>

<text class="serif acc" x="80" y="858" font-size="300" font-weight="700" letter-spacing="-6">3 Go</text>

<text class="sans mut" x="80" y="936" font-size="16">Cent fois moins de place, pour un service annoncé comparable.</text>

<!-- ============ coverlines secondaires, en tableau serré ============ -->
<line class="hair" x1="80" y1="1006" x2="920" y2="1006" stroke-width="1"/>
<text class="sans acc" x="80" y="1042" font-size="13" font-weight="700" letter-spacing=".14em">01</text>
<text class="sans ink" x="140" y="1042" font-size="19" font-weight="400">AirLLM charge un grand modèle morceau par morceau</text>

<line class="hair" x1="80" y1="1066" x2="920" y2="1066" stroke-width="1"/>
<text class="sans acc" x="80" y="1102" font-size="13" font-weight="700" letter-spacing=".14em">02</text>
<text class="sans ink" x="140" y="1102" font-size="19" font-weight="400">Le Mac mini M5 Pro, repensé pour l'IA locale</text>

<line class="hair" x1="80" y1="1126" x2="920" y2="1126" stroke-width="1"/>
<text class="sans acc" x="80" y="1162" font-size="13" font-weight="700" letter-spacing=".14em">03</text>
<text class="sans ink" x="140" y="1162" font-size="19" font-weight="400">Meta ouvre Muse Glimmer, son modèle agentique</text>
<line class="hair" x1="80" y1="1186" x2="920" y2="1186" stroke-width="1"/>

<!-- ============ pied ============ -->

<!-- Ce que contient l'édition, en face de la signature. Les liens sont
     comptés dans la page de l'édition d'après l'icône de source de chaque
     brève : Instagram et YouTube comptent comme vidéo, le livre ouvert
     comme lecture. Rien ne s'affiche quand un compteur vaut zéro.
     Bloc régénéré par outils/maj-pied-jaquettes.py -->
<text class="sans caps mut" x="80" y="1276" font-size="15" letter-spacing=".22em"><tspan class="acc" font-weight="700">8</tspan> vidéos · <tspan class="acc" font-weight="700">2</tspan> lectures</text>

<text class="sans caps mut" x="920" y="1276" font-size="15" letter-spacing=".22em" text-anchor="end">Par Nicolas Peytavin</text>
<text class="sans mut" x="920" y="1302" font-size="14" text-anchor="end">Bimensuel</text>
</svg>
